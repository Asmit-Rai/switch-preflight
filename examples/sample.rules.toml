# The Flip the Switch ruleset, for the generated sample project (examples/make_sample.py).
#
# The sample's `origin` is a made-up GitHub URL that was never pushed, so `repo-public` could never
# pass. This file extends the real contest ruleset and makes that one check advisory, so the demo can
# reach READY after the planted defects are fixed. Every other check is inherited unchanged.

[meta]
name = "Flip the Switch Hackathon (sample project)"
version = 1
extends = "../rules/flip-the-switch.toml"

[[check]]
id = "repo-public"
required = false
