# The Flip the Switch ruleset, for the generated sample project (examples/make_sample.py).
#
# The sample's `origin` is a real public repository (github.com/Asmit-Rai/preflight-sample), so
# `repo-public` passes when you are online. With no network GitHub cannot be asked, the check is
# SKIPped, and a SKIPped required check blocks READY. This file extends the real contest ruleset and
# makes that one check advisory, so the sample can reach READY offline too. Every other check is
# inherited unchanged.

[meta]
name = "Flip the Switch Hackathon (sample project)"
version = 1
extends = "../rules/flip-the-switch.toml"

[[check]]
id = "repo-public"
required = false
